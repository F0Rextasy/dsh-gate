name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: check out the adapter gates
        run: |
          git clone --depth 1 https://github.com/F0Rextasy/prove-it.git ../prove-it
          git clone --depth 1 https://github.com/F0Rextasy/testgate.git ../testgate
      - name: contract tests
        run: python -m unittest discover -s tests -v
